name: Påminnelser

# Skickar påminnelsen kvällen före utifrån state.json, som Macen hämtar och
# pushar (mac/kor.sh). Sajten spärrar molnservrar, så här hämtas inget.

on:
  schedule:
    - cron: "17 6 * * *"    # ca 07:17 vintertid, 08:17 sommartid
    - cron: "17 14 * * *"   # ca 15:17 vintertid, 16:17 sommartid
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sophamtning
  cancel-in-progress: false

jobs:
  paminn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Påminnelse kvällen före, larm om schemat är gammalt
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAMINNELSE_KL: ${{ vars.PAMINNELSE_KL || '19:00' }}
        run: python sophamtning.py --paminn

      - name: Spara vilka påminnelser som har skickats
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f paminda.json ] && git add paminda.json
          if git diff --cached --quiet; then echo "Inget nytt att spara."; exit 0; fi
          git commit -q -m "Påminnelse skickad"
          git pull -q --rebase
          git push -q

      # Sist, så att ett trasigt test aldrig stoppar påminnelserna.
      - name: Tester
        if: always()
        run: python -m unittest discover -s tests > /dev/null
