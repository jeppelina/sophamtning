name: Uppdatera hämtschema

on:
  schedule:
    - cron: "17 6 * * *"    # ca 07:17 vintertid, 08:17 sommartid
    - cron: "17 14 * * *"   # ca 15:17 vintertid, 16:17 sommartid
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sophamtning
  cancel-in-progress: false

jobs:
  uppdatera:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt

      - name: Hämta schema, skriv kalender, skicka notiser
        env:
          SOPHAMTNING_ADRESS: ${{ secrets.SOPHAMTNING_ADRESS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAMINNELSE_KL: ${{ vars.PAMINNELSE_KL || '19:00' }}
        run: python sophamtning.py

      - name: Spara schema och kalender
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in state.json sophamtning.ics; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "Inget nytt att spara."; exit 0; fi
          git commit -q -m "Uppdatera hämtschema"
          git pull -q --rebase
          git push -q

      # Sist, så att ett trasigt test aldrig stoppar påminnelserna.
      - name: Tester
        if: always()
        run: python -m unittest discover -s tests > /dev/null
